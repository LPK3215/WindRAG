services:
  windrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windrag
    ports:
      # 宿主机 8000 -> 容器 8000（主线 Web 界面用 8000，不是遗留版的 7860）
      - "8000:8000"
    volumes:
      # 只挂配置文件（含密钥，不打包进镜像）；不挂 data/，避免本地索引覆盖镜像内构建好的索引
      - ./config.env:/app/config.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app:/app/src
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
