name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The Node gate reads pipeline.config.json and runs the same sequence used
      # by local verification: corpus generation, build, eval, ablation, and all
      # generated documentation checks.
      - name: Release gate
        run: node scripts/verify.mjs
