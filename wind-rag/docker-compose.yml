version: "3.8"

services:
  windrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windrag
    ports:
      - "7860:7860"
    volumes:
      # 挂载配置文件（含API密钥，不打包进镜像）
      - ./config.env:/app/config.env:ro
      # 持久化模型缓存（避免每次启动重新下载）
      - windrag-models:/root/.cache
      # 持久化索引数据
      - ./data/processed:/app/data/processed
      - ./data/adaptive_model:/app/data/adaptive_model
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  windrag-models:
    driver: local
